<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chhota Bheem Style Live Drawing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#050b22,#121a31);color:white;font-family:Arial,sans-serif}
.page{min-height:100vh;padding:14px 10px 30px;text-align:center}
h1{font-size:clamp(25px,7vw,44px);margin:8px 0}
#status{font-size:clamp(18px,5vw,28px);color:#ffe58a;margin:4px 0 12px}
.track{height:13px;border:2px solid white;border-radius:20px;overflow:hidden;max-width:680px;margin:0 auto 14px}
#bar{height:100%;width:0;background:linear-gradient(90deg,#ff9d00,#ef4444,#22c55e)}
.board{background:#fff;border-radius:24px;padding:10px;max-width:720px;margin:auto;box-shadow:0 15px 45px #0008}
canvas{width:100%;display:block;border-radius:16px;background:#f7fbff}
#caption{margin:12px auto;font-size:16px;opacity:.9}
button{display:none;border:0;border-radius:14px;padding:13px 24px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="page">
<h1>🎨 Chhota Bheem Drawing</h1>
<div id="status">Drawing बन रही है… 03:00</div>
<div class="track"><div id="bar"></div></div>
<div class="board"><canvas id="c" width="700" height="760"></canvas></div>
<div id="caption">हर हिस्सा धीरे-धीरे canvas पर बनता हुआ दिखाई देगा।</div>
<button id="again" onclick="location.reload()">🔄 फिर से बनाएं</button>
</div>

<script>
const c=document.getElementById("c"),g=c.getContext("2d");
const TOTAL=180000, start=performance.now();

function clear(){
 g.fillStyle="#f7fbff";g.fillRect(0,0,700,760);
 g.fillStyle="#b7e58b";g.fillRect(0,710,700,50);
}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function shape(draw,p){
 if(p<=0)return;
 g.save();g.globalAlpha=ease(Math.min(1,p));draw();g.restore();
}
function outline(){
 g.strokeStyle="#2a160d";g.lineWidth=8;g.lineCap="round";g.lineJoin="round";
}
function head(p){
 shape(()=>{
  g.fillStyle="#f2ad62";g.beginPath();g.ellipse(350,240,118,125,0,0,Math.PI*2);g.fill();outline();g.stroke();
  g.fillStyle="#111";g.beginPath();g.arc(350,170,105,Math.PI,Math.PI*2);g.fill();
  g.fillStyle="#f2ad62";g.beginPath();g.ellipse(230,245,31,43,-.1,0,Math.PI*2);g.ellipse(470,245,31,43,.1,0,Math.PI*2);g.fill();outline();g.stroke();
 },p);
}
function face(p){
 shape(()=>{
  // eyebrows
  outline();g.beginPath();g.moveTo(292,220);g.quadraticCurveTo(315,205,335,220);g.moveTo(365,220);g.quadraticCurveTo(385,205,408,220);g.stroke();
  // eyes
  g.fillStyle="#fff";g.beginPath();g.ellipse(315,255,23,30,0,0,Math.PI*2);g.ellipse(385,255,23,30,0,0,Math.PI*2);g.fill();outline();g.stroke();
  g.fillStyle="#111";g.beginPath();g.arc(315,258,10,0,Math.PI*2);g.arc(385,258,10,0,Math.PI*2);g.fill();
  g.fillStyle="#fff";g.beginPath();g.arc(318,254,3,0,Math.PI*2);g.arc(388,254,3,0,Math.PI*2);g.fill();
  // nose
  g.strokeStyle="#7b3f20";g.lineWidth=5;g.beginPath();g.moveTo(350,270);g.lineTo(341,308);g.lineTo(360,308);g.stroke();
  // smile
  g.beginPath();g.arc(350,315,38,.15,Math.PI-.15);g.stroke();
 },p);
}
function body(p){
 shape(()=>{
  g.fillStyle="#f2ad62";g.beginPath();g.ellipse(350,440,105,125,0,0,Math.PI*2);g.fill();outline();g.stroke();
  // arms
  g.beginPath();g.ellipse(245,445,43,120,-.18,0,Math.PI*2);g.ellipse(455,445,43,120,.18,0,Math.PI*2);g.fill();g.stroke();
 },p);
}
function clothes(p){
 shape(()=>{
  // red dhoti
  g.fillStyle="#d82c24";g.beginPath();g.moveTo(260,385);g.lineTo(440,385);g.lineTo(475,575);g.lineTo(390,575);g.lineTo(350,470);g.lineTo(310,575);g.lineTo(225,575);g.closePath();g.fill();outline();g.stroke();
  // yellow waistband
  g.fillStyle="#ffd51b";g.fillRect(260,385,180,35);outline();g.strokeRect(260,385,180,35);
  // necklace
  g.strokeStyle="#ffd51b";g.lineWidth=10;g.beginPath();g.arc(350,390,53,.15,Math.PI-.15);g.stroke();
  g.fillStyle="#ffd51b";g.beginPath();g.arc(350,437,9,0,Math.PI*2);g.fill();
 },p);
}
function legs(p){
 shape(()=>{
  g.fillStyle="#f2ad62";g.beginPath();g.ellipse(300,610,46,105,0,0,Math.PI*2);g.ellipse(400,610,46,105,0,0,Math.PI*2);g.fill();outline();g.stroke();
  g.fillStyle="#60381e";g.beginPath();g.ellipse(285,710,70,27,0,0,Math.PI*2);g.ellipse(415,710,70,27,0,0,Math.PI*2);g.fill();outline();g.stroke();
 },p);
}
function details(p){
 shape(()=>{
  // wrist bands
  g.fillStyle="#ffd51b";g.fillRect(210,475,32,12);g.fillRect(458,475,32,12);
  // belt ornament
  g.fillStyle="#ffd51b";g.beginPath();g.arc(350,402,8,0,Math.PI*2);g.fill();
  // ground
  g.fillStyle="#4e9d2d";g.fillRect(0,735,700,25);
  g.fillStyle="#fff";g.font="bold 21px Arial";g.fillText("Drawing Complete ✨",260,755);
 },p);
}
function render(ms){
 clear();
 head(ms/30000);
 face((ms-30000)/25000);
 body((ms-55000)/30000);
 clothes((ms-85000)/30000);
 legs((ms-115000)/30000);
 details((ms-150000)/30000);
}
function loop(now){
 let e=Math.min(TOTAL,now-start), left=Math.max(0,TOTAL-e);
 let s=Math.ceil(left/1000);
 document.getElementById("status").textContent=e<TOTAL?
   `Drawing बन रही है… ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:
   "🎉 Drawing पूरी हो गई!";
 document.getElementById("bar").style.width=(e/TOTAL*100)+"%";
 let step=e<30000?"चेहरा और सिर बन रहा है…":
          e<55000?"आँखें, भौंहें और मुस्कान…":
          e<85000?"शरीर और हाथ बन रहे हैं…":
          e<115000?"लाल-पीला costume बन रहा है…":
          e<150000?"पैर और जूते बन रहे हैं…":"आखिरी details…";
 document.getElementById("caption").textContent=step;
 render(e);
 if(e<TOTAL) requestAnimationFrame(loop);
 else document.getElementById("again").style.display="inline-block";
}
requestAnimationFrame(loop);
</script>
</body>
</html>
